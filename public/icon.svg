<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="#3b82f6"/>

  <!-- Clock circle -->
  <circle cx="256" cy="256" r="160" fill="white" stroke="#1e40af" stroke-width="8"/>

  <!-- Clock center dot -->
  <circle cx="256" cy="256" r="12" fill="#1e40af"/>

  <!-- Hour hand -->
  <line x1="256" y1="256" x2="256" y2="180" stroke="#1e40af" stroke-width="12" stroke-linecap="round"/>

  <!-- Minute hand -->
  <line x1="256" y1="256" x2="310" y2="256" stroke="#1e40af" stroke-width="8" stroke-linecap="round"/>

  <!-- Hour markers -->
  <circle cx="256" cy="116" r="8" fill="#1e40af"/>
  <circle cx="256" cy="396" r="8" fill="#1e40af"/>
  <circle cx="396" cy="256" r="8" fill="#1e40af"/>
  <circle cx="116" cy="256" r="8" fill="#1e40af"/>

  <!-- Quarter hour markers -->
  <circle cx="324" cy="172" r="6" fill="#60a5fa"/>
  <circle cx="340" cy="340" r="6" fill="#60a5fa"/>
  <circle cx="172" cy="340" r="6" fill="#60a5fa"/>
  <circle cx="188" cy="172" r="6" fill="#60a5fa"/>

  <!-- Checkmark overlay (for work tracking) -->
  <path d="M340 200 L240 300 L180 240" stroke="#10b981" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8"/>
</svg>
